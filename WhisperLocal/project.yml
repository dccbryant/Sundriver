name: WhisperLocal
options:
  bundleIdPrefix: com.specialforcesny
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  WhisperLocal:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WhisperLocal
        excludes:
          - "Resources/Info.plist"
    resources:
      - path: WhisperLocal/Resources/Assets.xcassets
    info:
      path: WhisperLocal/Resources/Info.plist
      properties:
        CFBundleDisplayName: WhisperLocal
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: WhisperLocal needs the microphone to transcribe what you say. Audio never leaves your device.
        NSSpeechRecognitionUsageDescription: WhisperLocal performs speech recognition fully on-device. Nothing is sent to a server.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.specialforcesny.WhisperLocal
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
